<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Azure Horizon Captain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script type="importmap">
      {
        "imports": {
          "phaser": "https://esm.sh/phaser@3.70.0",
          "tone": "https://esm.sh/tone@14.7.77",
          "@instantdb/core": "https://esm.sh/@instantdb/core@0.22.155"
        }
      }
    </script>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        background: #000;
        overflow: hidden;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: none;
        text-size-adjust: none;
      }

      canvas {
        display: block;
        touch-action: none;
      }

      /* === Scrollbars ausblenden === */
      ::-webkit-scrollbar { width: 0; height: 0; background: transparent; }

      /* === Animationen === */
      @keyframes shake {
        0%,100% { transform:translateX(0); }
        25%      { transform:translateX(-5px); }
        75%      { transform:translateX(5px); }
      }
      @keyframes starPop {
        0%   { transform:scale(0.5); opacity:0; }
        70%  { transform:scale(1.2); }
        100% { transform:scale(1); opacity:1; }
      }
      @keyframes repPulse {
        0%,100% { opacity:1; }
        50%     { opacity:0.55; }
      }
      @keyframes slideUp {
        from { transform:translateY(24px);opacity:0; }
        to   { transform:translateY(0);opacity:1; }
      }
      @keyframes fadeIn {
        from { opacity:0; }
        to   { opacity:1; }
      }
      @keyframes bonusBounce {
        0%,100% { transform:scale(1); }
        50%     { transform:scale(1.08); }
      }

      /* === Hochformat-Fallback === */
      @media screen and (orientation: portrait) {
        #nav-player-info {
          width: 100% !important;
          height: 44px !important;
          border-right: none !important;
          border-bottom: 1px solid rgba(212,175,55,0.3) !important;
        }
        #dom-nav-bar {
          top: 44px !important;
          height: 52px !important;
        }
        #nav-stats {
          top: 96px !important;
          left: 0 !important;
          width: 100% !important;
          height: 32px !important;
          flex-direction: row !important;
          align-items: center !important;
          justify-content: space-around !important;
          border-right: none !important;
          border-bottom: 1px solid rgba(74,200,255,0.25) !important;
          padding: 0 10px !important;
          gap: 8px !important;
        }
        #rep-hud {
          top: 128px !important;
          width: 100% !important;
        }
        #item-bar {
          right: 50% !important;
          transform: translateX(50%) !important;
          bottom: 92px !important;
          flex-direction: row !important;
        }
      }

      /* === Level-Up Popup === */
      #level-up-popup {
        max-width: min(340px, 92vw) !important;
      }
      #lu-star { animation: starPop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    </style>
  </head>
  <body>
    <script type="module" src="main.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/ChatManager.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/ImageGenerator.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/ProgressLogger.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/OGP.js"></script>
    <script>
      (function() {
        let fsRequested = false;
        function requestFS() {
          if (fsRequested) return;
          fsRequested = true;
          const el = document.documentElement;
          const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
          if (fn) fn.call(el).catch(() => {});
        }
        document.addEventListener('touchend', requestFS, { once: true, passive: true });
        document.addEventListener('click', requestFS, { once: true });

        window.onerror = function(msg, src, line, col, err) {
          const div = document.createElement('div');
          div.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:#c00;color:#fff;padding:10px;font:13px monospace;max-height:50vh;overflow:auto;word-break:break-all;';
          div.textContent = '❌ ' + msg + (src ? ' [' + src.split('/').pop() + ':' + line + ':' + col + ']' : '');
          document.body.appendChild(div);
          return false;
        };
        window.addEventListener('unhandledrejection', function(e) {
          const div = document.createElement('div');
          div.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:#900;color:#fff;padding:10px;font:13px monospace;max-height:50vh;overflow:auto;word-break:break-all;';
          div.textContent = '⚠ Promise: ' + (e.reason?.message || e.reason || 'unknown');
          document.body.appendChild(div);
        });
      })();
    </script>
  </body>
</html>
